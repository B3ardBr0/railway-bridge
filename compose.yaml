# railway-bridge as a Compose project. deploy.sh renders this file,
# railway_bridge.py, railway-bridge.env (what the container reads) and
# deployment.env (the bind address) into one release directory. By hand:
#
#   docker compose --env-file deployment.env up -d
#
# Docker reads the env file when the container is created, so after changing it
# run `up -d --force-recreate`; a plain restart keeps the old values.

# One project name for every release directory, so a new release recreates the
# same container instead of starting a second project beside it.
name: railway-bridge

services:
  railway-bridge:
    # Pinned so a pull never changes the runtime underneath.
    image: python:3.12.15-alpine3.24@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    container_name: railway-bridge
    restart: unless-stopped
    command: ["python", "-B", "/app/railway_bridge.py"]
    env_file:
      # raw: values are taken byte for byte, never interpolated or unquoted.
      - path: railway-bridge.env
        format: raw
    environment:
      # The Compose deployment deliberately fixes one internal port so the
      # published port and healthcheck cannot disagree with the application.
      BRIDGE_PORT: "8098"
    ports:
      # Exporter output includes traffic counts and recent deploy messages and
      # has no authentication. It listens only on one private address, never
      # on every interface; deployment.env names it.
      - "${RAILWAY_BRIDGE_BIND_IP:?set in deployment.env}:8098:8098"
    volumes:
      - ./railway_bridge.py:/app/railway_bridge.py:ro
    # It only reads its environment and talks HTTP, so it needs no root or
    # capabilities. The root filesystem is read-only; only ephemeral /tmp is
    # writable.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8098/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
